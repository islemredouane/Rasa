<!doctype html>
<!-- README preview: the homepage on desktop and the events page on a phone.
     Rendered to ../preview.webp by scripts/render-readme-assets.py, from the screenshots in shots/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; background: transparent; }
  .stage { position: relative; width: 1280px; height: 720px; border-radius: 28px; overflow: hidden;
    background: radial-gradient(circle at 25% 20%, rgba(234,106,31,.30), transparent 55%),
                radial-gradient(circle at 85% 90%, rgba(249,168,37,.14), transparent 50%), #050505;
    border: 1px solid rgba(255,255,255,.08); }
  .stage::after { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 42px 42px; pointer-events: none; }

  /* desktop browser */
  .browser { position: absolute; left: 60px; top: 70px; width: 920px; border-radius: 16px; overflow: hidden; z-index: 1;
    background: #111; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 40px 90px rgba(0,0,0,.7), 0 0 60px rgba(234,106,31,.12); }
  .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1a1a1a; border-bottom: 1px solid rgba(255,255,255,.08); }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3f3f46; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .url { margin-left: 18px; flex: 1; height: 24px; border-radius: 999px; background: #0b0b0b; border: 1px solid rgba(255,255,255,.08);
    color: #a1a1aa; font: 600 12px/22px system-ui, sans-serif; padding: 0 14px; }
  .url b { color: #fff; font-weight: 600; }
  .browser img { display: block; width: 100%; height: 535px; object-fit: cover; object-position: top; }

  /* phone */
  .phone { position: absolute; right: 70px; top: 40px; width: 300px; height: 640px; border-radius: 46px; padding: 12px; z-index: 2;
    background: #0b0b0b; border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 40px 90px rgba(0,0,0,.8), 0 0 0 6px #1c1c1c, 0 0 50px rgba(234,106,31,.18); }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #000; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .notch { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 96px; height: 26px; border-radius: 999px; background: #000; z-index: 3; }
</style>
</head>
<body>
  <div class="stage">
    <div class="browser">
      <div class="bar"><i></i><i></i><i></i><div class="url">https://<b>rasa-off.vercel.app</b></div></div>
      <img src="shots/desktop.png" alt="">
    </div>
    <div class="phone"><div class="screen"><div class="notch"></div><img src="shots/mobile.png" alt=""></div></div>
  </div>
</body>
</html>
