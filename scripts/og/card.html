<!doctype html>
<!-- Social preview card (Open Graph / Twitter), 1200x630. Rendered by scripts/make-og.py for every page.
     Query parameters: title, eyebrow, line, stat, statLabel, img (path from the repo root), fit=contain|cover -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Offside&family=Quicksand:wght@500;600;700&display=block">
<style>
  :root { --orange: #ea6a1f; --gold: #ffb74d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #000; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #000; font-family: 'Quicksand', sans-serif; color: #fff; }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); }
  .glow.a { width: 640px; height: 640px; left: -240px; top: -300px; background: rgba(234,106,31,.30); }
  .glow.b { width: 420px; height: 420px; left: 380px; bottom: -300px; background: rgba(249,168,37,.14); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse at 25% 45%, #000 0%, transparent 70%); mask-image: radial-gradient(ellipse at 25% 45%, #000 0%, transparent 70%); }

  .left { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 600px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; filter: drop-shadow(0 0 16px rgba(234,106,31,.55)); }
  .brand span { font-family: 'Offside', sans-serif; font-size: 30px; }
  .eyebrow { margin-top: auto; display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px;
    background: rgba(234,106,31,.10); border: 1px solid rgba(234,106,31,.38); color: var(--orange);
    font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 4px rgba(234,106,31,.25); }
  h1 { margin-top: 22px; font-family: 'Offside', sans-serif; font-weight: 400; font-size: 88px; line-height: .98; letter-spacing: -1px; }
  h1 .metal { background: linear-gradient(to right, var(--orange) 20%, var(--gold) 45%, var(--orange) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .line { margin-top: 22px; font-size: 26px; font-weight: 600; color: rgba(255,255,255,.88); line-height: 1.35; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 14px; color: #8b8b93; font-size: 20px; font-weight: 700; }
  .foot i { display: block; width: 120px; height: 6px; border-radius: 6px; background: var(--orange); }

  .right { position: absolute; right: 0; top: 0; bottom: 0; width: 470px; }
  .right .ph { position: absolute; inset: 0; background-size: cover; background-position: center;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 34%); mask-image: linear-gradient(to right, transparent 0%, #000 34%); }
  .right .ph.contain { background-size: 92%; background-repeat: no-repeat; mix-blend-mode: lighten;
    -webkit-mask-image: radial-gradient(circle at 58% 50%, #000 48%, transparent 72%); mask-image: radial-gradient(circle at 58% 50%, #000 48%, transparent 72%); }
  .right .tint { position: absolute; inset: 0; background: linear-gradient(to right, #000 0%, rgba(0,0,0,0) 40%), linear-gradient(to top, rgba(0,0,0,.55), transparent 45%); }
  .stat { position: absolute; right: 48px; bottom: 56px; padding: 16px 22px; border-radius: 20px; background: rgba(15,15,15,.88);
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 18px 40px rgba(0,0,0,.6); }
  .stat b { display: block; font-family: 'Offside', sans-serif; font-weight: 400; font-size: 44px; line-height: 1; color: var(--orange); }
  .stat small { display: block; margin-top: 6px; color: #c4c4cc; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow a"></div><div class="glow b"></div><div class="grid"></div>
    <div class="right" id="right"><div class="ph" id="ph"></div><div class="tint"></div></div>
    <div class="left">
      <div class="brand"><img src="../../rasa-logo.png" alt=""><span>Rasa Club</span></div>
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="title"></h1>
      <p class="line" id="line"></p>
      <div class="foot"><i></i>rasa-off.vercel.app</div>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const words = (q.get("title") || "Rasa Club").split(" ");
  document.getElementById("title").innerHTML =
    `<span class="metal">${words[0]}</span>${words.length > 1 ? "<br>" + words.slice(1).join(" ") : ""}`;
  document.getElementById("eyebrow").textContent = q.get("eyebrow") || "ESTIN Béjaïa";
  document.getElementById("line").textContent = q.get("line") || "";
  const img = q.get("img");
  const ph = document.getElementById("ph");
  if (img) {
    ph.style.backgroundImage = `url("../../${img}")`;
    if (q.get("fit") === "contain") ph.classList.add("contain");
  } else {
    document.getElementById("right").remove();
  }
  if (q.get("stat")) {
    const s = document.createElement("div");
    s.className = "stat";
    s.innerHTML = `<b></b><small></small>`;
    s.querySelector("b").textContent = q.get("stat");
    s.querySelector("small").textContent = q.get("statLabel") || "";
    document.querySelector(".card").append(s);
  }
</script>
</body>
</html>
