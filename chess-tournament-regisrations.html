    <script>
      (function initDropdowns() {
        const dropdowns = document.querySelectorAll("[data-dropdown]");

        function closeAll(except) {
          dropdowns.forEach((d) => {
            if (d === except) return;
            const menu = d.querySelector("[data-dropdown-menu]");
            const trigger = d.querySelector("[data-dropdown-trigger]");
            if (!menu || !trigger) return;
            menu.classList.add("hidden");
            trigger.setAttribute("aria-expanded", "false");
          });
        }

        dropdowns.forEach((dropdown) => {
          const trigger = dropdown.querySelector("[data-dropdown-trigger]");
          const menu = dropdown.querySelector("[data-dropdown-menu]");
          const label = dropdown.querySelector("[data-dropdown-label]");
          const valueInput = dropdown.querySelector("[data-dropdown-value]");
          const options = dropdown.querySelectorAll("[data-dropdown-option]");

          if (!trigger || !menu || !label || !valueInput) return;

          trigger.addEventListener("click", () => {
            const isOpen = !menu.classList.contains("hidden");
            closeAll(dropdown);
            menu.classList.toggle("hidden", isOpen);
            trigger.setAttribute("aria-expanded", String(!isOpen));
          });

          options.forEach((opt) => {
            opt.addEventListener("click", () => {
              const val = opt.getAttribute("data-value") || "";
              valueInput.value = val;
              label.textContent = opt.textContent.trim();
              label.classList.remove("text-gray-500");
              label.classList.add("text-white");

              menu.classList.add("hidden");
              trigger.setAttribute("aria-expanded", "false");
            });
          });
        });

        document.addEventListener("click", (e) => {
          const inside = e.target.closest("[data-dropdown]");
          if (!inside) closeAll();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeAll();
        });
      })();
    </script>
